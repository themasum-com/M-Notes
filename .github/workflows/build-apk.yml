name: Build and Release Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Run unit & security tests
        run: npm test

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Assets
        run: |
          mkdir -p release-assets
          APK_FILE=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::No release APK found!"
            exit 1
          fi
          echo "Found release APK: $APK_FILE"

          # Clean universal filename for direct download
          cp "$APK_FILE" release-assets/M-Notes.apk

          # Versioned filename when triggered by a Git tag
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            cp "$APK_FILE" "release-assets/M-Notes-${TAG_NAME}.apk"
          fi

          ls -lh release-assets/

      - name: Upload Standalone Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: M-Notes-Release-APK
          path: release-assets/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: M Notes ${{ github.ref_name }}
          files: release-assets/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
